server:
  port: ${SERVER_PORT:8185}

spring:
  application:
    name: occupify-administration
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    parser:
      allow-unquoted-control-chars: true
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:admin.env[.properties]
  web:
    resources:
      add-mappings: true
      static-locations: classpath:/static/
  datasource:
    url: ${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5534}/${POSTGRES_DB:occupify_administration}}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_USER:guest}}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0

app:
  auth:
    dev-mock:
      enabled: ${DEV_MOCK_AUTH_ENABLED:true}
      admin-id: ${DEV_MOCK_ADMIN_ID:99999999-0000-1111-2222-333333333333}
      admin-email: ${DEV_MOCK_ADMIN_EMAIL:admin@occupify.app}
  rabbitmq:
    project-exchange: ${RABBITMQ_PROJECT_EXCHANGE:occupify.project.exchange}
    project-queue: ${RABBITMQ_PROJECT_QUEUE:occupify.administration.project.queue}
    project-created-routing-key: ${RABBITMQ_PROJECT_CREATED_ROUTING_KEY:project.created}
    project-closed-routing-key: ${RABBITMQ_PROJECT_CLOSED_ROUTING_KEY:project.closed}
    user-exchange: ${RABBITMQ_USER_EXCHANGE:occupify.user.exchange}
    user-queue: ${RABBITMQ_USER_QUEUE:occupify.administration.user.queue}
    user-activated-routing-key: ${RABBITMQ_USER_ACTIVATED_ROUTING_KEY:user.activated}
    contract-exchange: ${RABBITMQ_CONTRACT_EXCHANGE:occupify.contract.exchange}
    contract-queue: ${RABBITMQ_CONTRACT_QUEUE:occupify.administration.contract.queue}
    contract-accepted-routing-key: ${RABBITMQ_CONTRACT_ACCEPTED_ROUTING_KEY:contract.accepted}
    contract-rejected-routing-key: ${RABBITMQ_CONTRACT_REJECTED_ROUTING_KEY:contract.rejected}
    contract-compensation-routing-key: ${RABBITMQ_CONTRACT_COMPENSATION_ROUTING_KEY:contract.compensation.#}
    report-exchange: ${RABBITMQ_REPORT_EXCHANGE:occupify.report.exchange}
    report-queue: ${RABBITMQ_REPORT_QUEUE:occupify.administration.report.queue}
    report-created-routing-key: ${RABBITMQ_REPORT_CREATED_ROUTING_KEY:report.created}
    report-updated-routing-key: ${RABBITMQ_REPORT_UPDATED_ROUTING_KEY:report.updated}
    dlx-exchange: ${RABBITMQ_DLX_EXCHANGE:occupify.administration.dlx}
    dlq-queue: ${RABBITMQ_USER_DLQ:occupify.administration.user.dlq}
    dlq-routing-key: ${RABBITMQ_USER_DLQ_ROUTING_KEY:user.dlq}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
